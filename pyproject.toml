[project]
name = "qarakal-workbench"
version = "0.1.0"
description = "Experiment and optimization workbench for Qarakal workflows."
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob",
    "bidict",
    "dill",
    "h5py",
    "httpx",
    "laboneq",
    "matplotlib",
    "numpy",
    "pydantic",
    "pymongo",
    "pytest",
    "redis",
    "scikit-learn",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [
    ".",
    "..",
]
testpaths = [
    "tests",
    "optimize/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "outputs",
    "laboneq_output",
    "data",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]
"amplitude_stability/*.py" = ["E402"]
"optimize/readout/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
